<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Simple TMS driver proof of delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--page:#F3F6F4;--ink:#17251F;--ink2:#4B5A53;--muted:#5B6B63;--green:#1F8A5B;--green-h:#146B45;--tint:#E7F4EC;--tint-ink:#146B45;
--line:#DCE7DF;--line2:#C9DBCF;--card-line:#E3EDE6;--row:#EDF3EF;--field:#F7FAF8;
--amber:#E8A317;--amber-ink:#8A5A00;--amber-bg:#FFF3D6;--amber-line:#F0D08A;
--red:#C9343D;--red-ink:#A3242C;--red-bg:#FCE9EA;--red-line:#F1B9BD;
--blue:#2F6FB8;--violet:#7B5CC4;--road:#5B6475;--verge:#E3F1E6;
--shadow:0 6px 20px rgba(23,37,31,.08);--shadow-lg:0 10px 30px rgba(23,37,31,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:#146B45}a:hover{color:#0E5034}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.3}
.p-green{background:#E3F3EA;color:#146B45}.p-amber{background:var(--amber-bg);color:var(--amber-ink)}.p-red{background:var(--red-bg);color:var(--red-ink)}
.p-grey{background:#EEF2EF;color:#4B5A53}.p-blue{background:#E4EEF9;color:#235596}.p-violet{background:#EEE9F9;color:#5F44A3}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--green)}
.btn.primary{border:0;background:var(--green);color:#fff;font-weight:800}.btn.primary:hover{background:var(--green-h);color:#fff}
.field{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:14px;color:var(--ink);width:100%}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--muted);font-size:14px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:10px;border-radius:999px;background:#E3EDE6;overflow:hidden}.bar>span{display:block;height:100%;border-radius:999px;background:var(--green)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}

html,body{min-height:100%}body{display:flex;justify-content:center;padding:24px 0;background:#E1ECE4}
.phone{position:relative;width:390px;height:844px;padding:18px 18px 16px;background:var(--page);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex:none}
.back{width:44px;height:44px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;text-decoration:none}
.ttl{font-size:18px;font-weight:800;line-height:1.2}.st{font-size:12px;color:var(--ink2)}
.chip{padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.card{padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.big{height:58px;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:0}
.big.primary{background:var(--green);color:#fff}.big.primary:hover{background:var(--green-h);color:#fff}
.big.ghost{background:#fff;color:var(--ink);border:2px solid var(--line2);font-size:16px}
.big.amber{background:var(--amber-bg);color:var(--amber-ink);font-size:16px}
.scanbox{min-height:62px;padding:10px 14px;border-radius:16px;border:2px dashed var(--green);background:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink);text-align:left;width:100%}
.scanbox b{display:block;font-size:16px;font-weight:800}.scanbox small{display:block;font-size:12px;color:var(--ink2)}
.lbl{font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--ink2)}
.input{height:54px;width:100%;padding:0 16px;border-radius:14px;font-size:17px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--line2)}
.goal{display:flex;flex-direction:column;gap:6px;flex:none}
.segs{display:grid;gap:4px}.segs span{height:10px;border-radius:999px;background:#D5E3D9}.segs .d{background:var(--green)}.segs .c{background:#7FC3A0}
</style>
</head>
<body>
<main class="phone" aria-label="Proof of delivery">

  <div class="top">
    <a href="DriverStop.html" class="back" aria-label="Back to the stop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
    <div style="flex:1;min-width:0"><div class="ttl">Proof of delivery</div><div class="st">Stop 5 of 12 · Hillside Bakery</div></div>
  </div>
  <div class="scroll" style="padding-bottom:230px">
    <div style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>This customer asks for a signature and printed name.</div>
    <section aria-label="Signature" style="border-radius:18px;background:#fff;border:2px solid var(--line2);padding:10px 12px;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">SIGN HERE</span><button type="button" style="border:0;background:transparent;color:var(--green-h);font-weight:800;font-size:13px;cursor:pointer">Clear</button></div>
      <div role="img" aria-label="Signature captured"><svg viewBox="0 0 320 130" width="100%" height="130" aria-hidden="true"><path d="M34 92c14-40 26-52 32-40s-12 46-3 46 20-52 32-52-6 40 6 40 15-28 24-28 3 22 12 22 18-36 30-36-9 34 3 34 24-16 40-21 27-3 36-6" fill="none" stroke="#17251F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 108h272" stroke="#C9DBCF" stroke-width="1.5" stroke-dasharray="5 5"/></svg></div>
    </section>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800">Printed name
      <input class="input" type="text" value="Priya" autocomplete="off"></label>
    <button type="button" class="scanbox" style="border-color:var(--line2)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--green)"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg><span><b>Add a photo</b><small>Optional for this customer · 1 added</small></span></button>
  </div>
  <section role="status" aria-label="Delivered" style="position:absolute;left:12px;right:12px;bottom:12px;padding:20px 18px 16px;border-radius:24px;background:var(--green);color:#fff;box-shadow:0 -10px 40px rgba(23,37,31,.25);display:flex;flex-direction:column;gap:10px;overflow:hidden">
    <span aria-hidden="true" style="position:absolute;left:60%;top:10px;width:8px;height:8px;border-radius:2px;background:#E8A317;transform:rotate(20deg)"></span><span aria-hidden="true" style="position:absolute;left:68%;top:26px;width:8px;height:8px;border-radius:50%;background:#7FC3A0;transform:rotate(0deg)"></span><span aria-hidden="true" style="position:absolute;left:75%;top:8px;width:8px;height:8px;border-radius:2px;background:#FFFFFF;transform:rotate(45deg)"></span><span aria-hidden="true" style="position:absolute;left:82%;top:22px;width:8px;height:8px;border-radius:50%;background:#E8A317;transform:rotate(0deg)"></span><span aria-hidden="true" style="position:absolute;left:89%;top:6px;width:8px;height:8px;border-radius:2px;background:#7FC3A0;transform:rotate(30deg)"></span><span aria-hidden="true" style="position:absolute;left:93%;top:30px;width:8px;height:8px;border-radius:2px;background:#FFFFFF;transform:rotate(60deg)"></span><span aria-hidden="true" style="position:absolute;left:3%;top:6px;width:8px;height:8px;border-radius:2px;background:#BFE3CF;transform:rotate(15deg)"></span>
    <div style="display:flex;align-items:center;gap:12px;position:relative">
      <span style="width:52px;height:52px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;flex:none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>
      <div><div style="font-size:30px;font-weight:800;letter-spacing:-.4px;line-height:1">Ding!</div><div style="font-size:15px;font-weight:700;color:#E7F4EC">Stop 5 delivered · 5 of 12 done</div></div>
    </div>
    <div style="font-size:13px;color:#D5F0E1;position:relative">4 cartons · signed by Priya · 10:52 am</div>
    <a href="DriverStop.html" class="big" style="background:#fff;color:var(--green-h);position:relative">Next: stop 6 · Two Rivers Vet<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </section>
</main>
</body>
</html>
