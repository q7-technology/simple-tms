<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Simple TMS driver sign-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--page:#F3F6F4;--ink:#17251F;--ink2:#4B5A53;--muted:#5B6B63;--green:#1F8A5B;--green-h:#146B45;--tint:#E7F4EC;--tint-ink:#146B45;
--line:#DCE7DF;--line2:#C9DBCF;--card-line:#E3EDE6;--row:#EDF3EF;--field:#F7FAF8;
--amber:#E8A317;--amber-ink:#8A5A00;--amber-bg:#FFF3D6;--amber-line:#F0D08A;
--red:#C9343D;--red-ink:#A3242C;--red-bg:#FCE9EA;--red-line:#F1B9BD;
--blue:#2F6FB8;--violet:#7B5CC4;--road:#5B6475;--verge:#E3F1E6;
--shadow:0 6px 20px rgba(23,37,31,.08);--shadow-lg:0 10px 30px rgba(23,37,31,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:#146B45}a:hover{color:#0E5034}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.3}
.p-green{background:#E3F3EA;color:#146B45}.p-amber{background:var(--amber-bg);color:var(--amber-ink)}.p-red{background:var(--red-bg);color:var(--red-ink)}
.p-grey{background:#EEF2EF;color:#4B5A53}.p-blue{background:#E4EEF9;color:#235596}.p-violet{background:#EEE9F9;color:#5F44A3}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--green)}
.btn.primary{border:0;background:var(--green);color:#fff;font-weight:800}.btn.primary:hover{background:var(--green-h);color:#fff}
.field{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:14px;color:var(--ink);width:100%}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--muted);font-size:14px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:10px;border-radius:999px;background:#E3EDE6;overflow:hidden}.bar>span{display:block;height:100%;border-radius:999px;background:var(--green)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}

html,body{min-height:100%}body{display:flex;justify-content:center;padding:24px 0;background:#E1ECE4}
.phone{position:relative;width:390px;height:844px;padding:18px 18px 16px;background:var(--page);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex:none}
.back{width:44px;height:44px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;text-decoration:none}
.ttl{font-size:18px;font-weight:800;line-height:1.2}.st{font-size:12px;color:var(--ink2)}
.chip{padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.card{padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.big{height:58px;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:0}
.big.primary{background:var(--green);color:#fff}.big.primary:hover{background:var(--green-h);color:#fff}
.big.ghost{background:#fff;color:var(--ink);border:2px solid var(--line2);font-size:16px}
.big.amber{background:var(--amber-bg);color:var(--amber-ink);font-size:16px}
.scanbox{min-height:62px;padding:10px 14px;border-radius:16px;border:2px dashed var(--green);background:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink);text-align:left;width:100%}
.scanbox b{display:block;font-size:16px;font-weight:800}.scanbox small{display:block;font-size:12px;color:var(--ink2)}
.lbl{font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--ink2)}
.input{height:54px;width:100%;padding:0 16px;border-radius:14px;font-size:17px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--line2)}
.goal{display:flex;flex-direction:column;gap:6px;flex:none}
.segs{display:grid;gap:4px}.segs span{height:10px;border-radius:999px;background:#D5E3D9}.segs .d{background:var(--green)}.segs .c{background:#7FC3A0}
</style>
</head>
<body>
<main class="phone" aria-label="Driver sign-in">

  <div class="top" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 10 16 17 4 10Z" fill="#5BC28F"/><path d="M4 10 16 17V30L4 23Z" fill="#1F8A5B"/><path d="M28 10 16 17V30L28 23Z" fill="#146B45"/><path d="M10 6.5 22 13.5v4" fill="none" stroke="#E7F4EC" stroke-width="2"/></svg><span style="font-size:17px;font-weight:800">Simple TMS</span></div>
    <span class="chip">Driver app</span>
  </div>
  <h1 style="margin:4px 0 0;font-size:28px;font-weight:800;letter-spacing:-.4px">Morning! Ready to roll?</h1>
  <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800">Driver code
    <input class="input" type="text" autocomplete="username" autocapitalize="characters" value="KIM-07">
  </label>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span id="pin-label" style="font-size:14px;font-weight:800">PIN</span>
    <div role="img" aria-labelledby="pin-label" aria-label="2 of 4 numbers entered" style="display:flex;justify-content:center;gap:18px;padding:2px 0"><span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--green);background:var(--green)"></span><span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--green);background:var(--green)"></span><span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--green);background:transparent"></span><span style="width:18px;height:18px;border-radius:50%;border:2px solid var(--green);background:transparent"></span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">1</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">2</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">3</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">4</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">5</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">6</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">7</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">8</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">9</button><button type="button" aria-label="Clear PIN" style="height:52px;border-radius:16px;border:0;background:transparent;color:var(--ink2);font-size:15px;font-weight:800;cursor:pointer">Clear</button><button type="button" style="height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:24px;font-weight:800;cursor:pointer">0</button><button type="button" aria-label="Delete last number" style="height:52px;border-radius:16px;border:0;background:transparent;color:var(--ink2);cursor:pointer;display:grid;place-items:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11v12H9l-6-6Z"/><path d="m12 10 4 4M16 10l-4 4"/></svg></button></div>
  <a href="DriverPrestart.html" class="big primary">Sign in</a>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:12px;color:var(--muted)">
    <span style="display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8Z"/></svg>Location is shared only while you're on a run</span>
    <span>Your whole run loads onto the phone when you start, so black spots don't stop you.</span>
  </div>
</main>
</body>
</html>
