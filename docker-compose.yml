services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tms}
      POSTGRES_USER: ${POSTGRES_USER:-tms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5434 so it sits beside Simple WMS's database (5433) on one machine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tms} -d ${POSTGRES_DB:-tms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn tms.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      TMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tms}
      TMS_SECRET_KEY: ${TMS_SECRET_KEY:?set TMS_SECRET_KEY in .env}
      TMS_WMS_WEBHOOK_SECRET: ${TMS_WMS_WEBHOOK_SECRET:-}
      TMS_WMS_URL: ${TMS_WMS_URL:-}
      TMS_WMS_API_KEY: ${TMS_WMS_API_KEY:-}
      TMS_PLATEN_URL: ${TMS_PLATEN_URL:-}
      TMS_RUN_SHEET_PRINTER: ${TMS_RUN_SHEET_PRINTER:-dispatch}
      TMS_MAP_TILE_URL: ${TMS_MAP_TILE_URL:-}
      TMS_MAP_ATTRIBUTION: ${TMS_MAP_ATTRIBUTION:-}
      TMS_ETA_MINUTES_PER_STOP: ${TMS_ETA_MINUTES_PER_STOP:-20}
    volumes:
      # signatures and photos for proof of delivery (TMS_POD_DIR)
      - pod_files:/data/pod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Caddy is the only door in a real install. Published on the host as well
    # for local work, CI and a Simple WMS on the same machine.
    ports:
      - "127.0.0.1:${TMS_API_PORT:-8022}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Makes the ship calls to Simple WMS and sends run sheets to Platen, from
  # their queues in the database, with backoff; and once an hour deletes
  # positions older than TMS_POSITION_RETENTION_DAYS. Waits for the api's
  # migrations.
  worker:
    build: ./api
    restart: unless-stopped
    command: python -m tms.worker
    environment:
      TMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tms}
      TMS_SECRET_KEY: ${TMS_SECRET_KEY:?set TMS_SECRET_KEY in .env}
      TMS_WMS_URL: ${TMS_WMS_URL:-}
      TMS_WMS_API_KEY: ${TMS_WMS_API_KEY:-}
      TMS_PLATEN_URL: ${TMS_PLATEN_URL:-}
      TMS_PLATEN_KEY: ${TMS_PLATEN_KEY:-}
      TMS_RUN_SHEET_PRINTER: ${TMS_RUN_SHEET_PRINTER:-dispatch}
      TMS_POSITION_RETENTION_DAYS: ${TMS_POSITION_RETENTION_DAYS:-90}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TMS_DOMAIN: ${TMS_DOMAIN:-localhost}
      TMS_HTTP_PORT: ${TMS_HTTP_PORT:-80}
      TMS_HTTPS_PORT: ${TMS_HTTPS_PORT:-443}
      # the map tile provider's origin, let into the desktop's CSP
      TMS_MAP_TILE_ORIGIN: ${TMS_MAP_TILE_ORIGIN:-}
    # The same port inside and out: Caddy names it in its redirect to https.
    ports:
      - "${TMS_HTTP_PORT:-80}:${TMS_HTTP_PORT:-80}"
      - "${TMS_HTTPS_PORT:-443}:${TMS_HTTPS_PORT:-443}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # the desktop app, built on the host: cd apps/desktop && npm run build
      - ./apps/desktop/dist:/srv/desktop:ro
      # the driver app, built on the host: cd apps/driver && npm run build
      - ./apps/driver/dist:/srv/driver:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  pod_files:
  caddy_data:
  caddy_config:
