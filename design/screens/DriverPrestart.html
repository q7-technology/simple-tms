<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Simple TMS driver pre-start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--page:#F3F6F4;--ink:#17251F;--ink2:#4B5A53;--muted:#5B6B63;--green:#1F8A5B;--green-h:#146B45;--tint:#E7F4EC;--tint-ink:#146B45;
--line:#DCE7DF;--line2:#C9DBCF;--card-line:#E3EDE6;--row:#EDF3EF;--field:#F7FAF8;
--amber:#E8A317;--amber-ink:#8A5A00;--amber-bg:#FFF3D6;--amber-line:#F0D08A;
--red:#C9343D;--red-ink:#A3242C;--red-bg:#FCE9EA;--red-line:#F1B9BD;
--blue:#2F6FB8;--violet:#7B5CC4;--road:#5B6475;--verge:#E3F1E6;
--shadow:0 6px 20px rgba(23,37,31,.08);--shadow-lg:0 10px 30px rgba(23,37,31,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:#146B45}a:hover{color:#0E5034}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.3}
.p-green{background:#E3F3EA;color:#146B45}.p-amber{background:var(--amber-bg);color:var(--amber-ink)}.p-red{background:var(--red-bg);color:var(--red-ink)}
.p-grey{background:#EEF2EF;color:#4B5A53}.p-blue{background:#E4EEF9;color:#235596}.p-violet{background:#EEE9F9;color:#5F44A3}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--green)}
.btn.primary{border:0;background:var(--green);color:#fff;font-weight:800}.btn.primary:hover{background:var(--green-h);color:#fff}
.field{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:14px;color:var(--ink);width:100%}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--muted);font-size:14px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:10px;border-radius:999px;background:#E3EDE6;overflow:hidden}.bar>span{display:block;height:100%;border-radius:999px;background:var(--green)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}

html,body{min-height:100%}body{display:flex;justify-content:center;padding:24px 0;background:#E1ECE4}
.phone{position:relative;width:390px;height:844px;padding:18px 18px 16px;background:var(--page);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex:none}
.back{width:44px;height:44px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;text-decoration:none}
.ttl{font-size:18px;font-weight:800;line-height:1.2}.st{font-size:12px;color:var(--ink2)}
.chip{padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.card{padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.big{height:58px;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:0}
.big.primary{background:var(--green);color:#fff}.big.primary:hover{background:var(--green-h);color:#fff}
.big.ghost{background:#fff;color:var(--ink);border:2px solid var(--line2);font-size:16px}
.big.amber{background:var(--amber-bg);color:var(--amber-ink);font-size:16px}
.scanbox{min-height:62px;padding:10px 14px;border-radius:16px;border:2px dashed var(--green);background:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink);text-align:left;width:100%}
.scanbox b{display:block;font-size:16px;font-weight:800}.scanbox small{display:block;font-size:12px;color:var(--ink2)}
.lbl{font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--ink2)}
.input{height:54px;width:100%;padding:0 16px;border-radius:14px;font-size:17px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--line2)}
.goal{display:flex;flex-direction:column;gap:6px;flex:none}
.segs{display:grid;gap:4px}.segs span{height:10px;border-radius:999px;background:#D5E3D9}.segs .d{background:var(--green)}.segs .c{background:#7FC3A0}
</style>
</head>
<body>
<main class="phone" aria-label="Pre-start check">

  <div class="top">
    <a href="DriverSignIn.html" class="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
    <div style="flex:1;min-width:0"><div class="ttl">Pre-start check</div><div class="st">Kim · Tue 13 Oct · before you roll</div></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;flex:none">
    <span class="lbl">YOUR TRUCK</span>
    <div role="radiogroup" aria-label="Pick your truck" style="display:flex;gap:6px">
      <button type="button" role="radio" aria-checked="true" style="flex:1;min-width:0;padding:8px 6px;border-radius:14px;cursor:pointer;text-align:center;border:2px solid var(--green);background:var(--tint)"><b style="display:block;font-size:14px">TMS-041</b><span style="font-size:11px;font-weight:700;color:var(--ink2)">Rigid · R-2207</span></button><button type="button" role="radio" aria-checked="false" style="flex:1;min-width:0;padding:8px 6px;border-radius:14px;cursor:pointer;text-align:center;border:1px solid var(--line);background:#fff"><b style="display:block;font-size:14px">TMS-063</b><span style="font-size:11px;font-weight:700;color:var(--ink2)">Van · spare</span></button><button type="button" role="radio" aria-checked="false" disabled style="flex:1;min-width:0;padding:8px 6px;border-radius:14px;cursor:not-allowed;text-align:center;border:1px dashed #C9D2CD;background:#F1F3F2;color:var(--muted)"><b style="display:block;font-size:14px">TMS-027</b><span style="font-size:11px;font-weight:700;color:var(--red-ink)">Grounded</span></button>
    </div>
  </div>
  <div class="scroll">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;padding:8px 12px;border-radius:16px;background:#fff;border:1px solid var(--line)"><span style="flex:1">Odometer</span>
      <input class="num" type="text" inputmode="numeric" value="61,208" style="width:130px;height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line2);font-size:17px;font-weight:800;text-align:right"><span style="color:var(--ink2)">km</span></label>
    <section aria-label="Checklist for a rigid truck" style="border-radius:18px;background:#fff;border:1px solid var(--line);overflow:hidden">
      <div style="padding:10px 12px 6px" class="lbl">RIGID CHECKLIST · 5 OF 6 PASS</div>
      <div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--row)">
  <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">Tyres</div></div>
  <div role="radiogroup" aria-label="Tyres" style="display:flex;gap:6px">
    <button type="button" role="radio" aria-checked="true" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:var(--green);color:#fff;border-color:var(--green)">Pass</button>
    <button type="button" role="radio" aria-checked="false" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--ink2)">Fail</button>
  </div>
</div><div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--row)">
  <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">Lights</div><div class="small">Critical item</div></div>
  <div role="radiogroup" aria-label="Lights" style="display:flex;gap:6px">
    <button type="button" role="radio" aria-checked="true" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:var(--green);color:#fff;border-color:var(--green)">Pass</button>
    <button type="button" role="radio" aria-checked="false" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--ink2)">Fail</button>
  </div>
</div><div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--row)">
  <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">Brakes</div><div class="small">Critical item</div></div>
  <div role="radiogroup" aria-label="Brakes" style="display:flex;gap:6px">
    <button type="button" role="radio" aria-checked="true" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:var(--green);color:#fff;border-color:var(--green)">Pass</button>
    <button type="button" role="radio" aria-checked="false" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--ink2)">Fail</button>
  </div>
</div><div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--row)">
  <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">Mirrors</div></div>
  <div role="radiogroup" aria-label="Mirrors" style="display:flex;gap:6px">
    <button type="button" role="radio" aria-checked="true" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:var(--green);color:#fff;border-color:var(--green)">Pass</button>
    <button type="button" role="radio" aria-checked="false" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--ink2)">Fail</button>
  </div>
</div>
      <div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--row)">
  <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">Load restraints</div></div>
  <div role="radiogroup" aria-label="Load restraints" style="display:flex;gap:6px">
    <button type="button" role="radio" aria-checked="false" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--ink2)">Pass</button>
    <button type="button" role="radio" aria-checked="true" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:var(--red);color:#fff;border-color:var(--red)">Fail</button>
  </div>
</div>
      <div style="padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px;background:#FFF8F8;border-top:1px solid var(--red-line)">
        <div style="font-size:12px;color:var(--red-ink);font-weight:700;padding-top:6px">A fail needs a photo and a note.</div>
        <div style="display:flex;gap:8px">
          <div role="img" aria-label="Photo taken: frayed strap" style="width:64px;height:58px;border-radius:12px;flex:none;overflow:hidden"><svg viewBox="0 0 64 58" width="64" height="58" aria-hidden="true"><rect width="64" height="58" fill="#6F7882"/><path d="M0 30 64 22v12L0 42Z" fill="#E8A317"/><path d="M30 26l4 6-3 4 5 4" stroke="#FFF3D6" stroke-width="2" fill="none"/></svg></div>
          <button type="button" class="scanbox" style="min-height:58px;padding:6px 12px;border-color:var(--line2);border-style:dashed"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg><span><b style="font-size:14px">Retake photo</b><small>1 photo added</small></span></button>
        </div>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800">Note
          <input class="field" type="text" value="Rear strap frayed near the hook. Using the spare."></label>
        <div class="small">Not a critical item, so you can still go. The fleet manager will see it.</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--row)">
  <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">Damage</div></div>
  <div role="radiogroup" aria-label="Damage" style="display:flex;gap:6px">
    <button type="button" role="radio" aria-checked="true" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:var(--green);color:#fff;border-color:var(--green)">Pass</button>
    <button type="button" role="radio" aria-checked="false" style="height:38px;min-width:60px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:var(--ink2)">Fail</button>
  </div>
</div>
    </section>
  </div>
  <a href="DriverStop.html" class="big primary" style="flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Finish check</a>
</main>
</body>
</html>
