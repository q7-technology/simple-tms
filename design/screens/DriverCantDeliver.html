<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Simple TMS driver can't deliver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--page:#F3F6F4;--ink:#17251F;--ink2:#4B5A53;--muted:#5B6B63;--green:#1F8A5B;--green-h:#146B45;--tint:#E7F4EC;--tint-ink:#146B45;
--line:#DCE7DF;--line2:#C9DBCF;--card-line:#E3EDE6;--row:#EDF3EF;--field:#F7FAF8;
--amber:#E8A317;--amber-ink:#8A5A00;--amber-bg:#FFF3D6;--amber-line:#F0D08A;
--red:#C9343D;--red-ink:#A3242C;--red-bg:#FCE9EA;--red-line:#F1B9BD;
--blue:#2F6FB8;--violet:#7B5CC4;--road:#5B6475;--verge:#E3F1E6;
--shadow:0 6px 20px rgba(23,37,31,.08);--shadow-lg:0 10px 30px rgba(23,37,31,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:#146B45}a:hover{color:#0E5034}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;line-height:1.3}
.p-green{background:#E3F3EA;color:#146B45}.p-amber{background:var(--amber-bg);color:var(--amber-ink)}.p-red{background:var(--red-bg);color:var(--red-ink)}
.p-grey{background:#EEF2EF;color:#4B5A53}.p-blue{background:#E4EEF9;color:#235596}.p-violet{background:#EEE9F9;color:#5F44A3}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--green)}
.btn.primary{border:0;background:var(--green);color:#fff;font-weight:800}.btn.primary:hover{background:var(--green-h);color:#fff}
.field{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:14px;color:var(--ink);width:100%}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--muted);font-size:14px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:10px;border-radius:999px;background:#E3EDE6;overflow:hidden}.bar>span{display:block;height:100%;border-radius:999px;background:var(--green)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}

html,body{min-height:100%}body{display:flex;justify-content:center;padding:24px 0;background:#E1ECE4}
.phone{position:relative;width:390px;height:844px;padding:18px 18px 16px;background:var(--page);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex:none}
.back{width:44px;height:44px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;text-decoration:none}
.ttl{font-size:18px;font-weight:800;line-height:1.2}.st{font-size:12px;color:var(--ink2)}
.chip{padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex:none}
.card{padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.big{height:58px;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:0}
.big.primary{background:var(--green);color:#fff}.big.primary:hover{background:var(--green-h);color:#fff}
.big.ghost{background:#fff;color:var(--ink);border:2px solid var(--line2);font-size:16px}
.big.amber{background:var(--amber-bg);color:var(--amber-ink);font-size:16px}
.scanbox{min-height:62px;padding:10px 14px;border-radius:16px;border:2px dashed var(--green);background:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--ink);text-align:left;width:100%}
.scanbox b{display:block;font-size:16px;font-weight:800}.scanbox small{display:block;font-size:12px;color:var(--ink2)}
.lbl{font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--ink2)}
.input{height:54px;width:100%;padding:0 16px;border-radius:14px;font-size:17px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--line2)}
.goal{display:flex;flex-direction:column;gap:6px;flex:none}
.segs{display:grid;gap:4px}.segs span{height:10px;border-radius:999px;background:#D5E3D9}.segs .d{background:var(--green)}.segs .c{background:#7FC3A0}
</style>
</head>
<body>
<main class="phone" aria-label="Can't deliver">

  <div class="top">
    <a href="DriverStop.html" class="back" aria-label="Back to the stop"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
    <div style="flex:1;min-width:0"><div class="ttl">Can't deliver</div><div class="st">Stop 6 of 12 · Two Rivers Vet · Smythesdale</div></div>
  </div>
  <div class="scroll">
    <span style="font-size:16px;font-weight:800">What happened?</span>
    <div role="radiogroup" aria-label="Reason" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <button type="button" role="radio" aria-checked="true" style="min-height:76px;padding:10px;border-radius:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid var(--green);background:var(--tint)"><span style="color:var(--green)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11v17M3 21h18"/><path d="M13 12h.01"/></svg></span><b style="font-size:15px">Closed</b><span class="small">Nobody there</span></button>
      <button type="button" role="radio" aria-checked="false" style="min-height:76px;padding:10px;border-radius:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:#fff"><span style="color:var(--ink2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg></span><b style="font-size:15px">Refused</b><span class="small">Customer said no</span></button>
      <button type="button" role="radio" aria-checked="false" style="min-height:76px;padding:10px;border-radius:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:#fff"><span style="color:var(--ink2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9Z"/><path d="m10 8 2 3-2 2 2 3"/></svg></span><b style="font-size:15px">Damaged</b><span class="small">Carton not fit to leave</span></button>
      <button type="button" role="radio" aria-checked="false" style="min-height:76px;padding:10px;border-radius:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:#fff"><span style="color:var(--ink2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M5 6h11l3 3-3 3H5Z"/></svg></span><b style="font-size:15px">Wrong address</b><span class="small">Can't find it</span></button>
    </div>
    <span class="lbl" style="margin-top:4px">PHOTO</span>
    <div style="display:flex;gap:8px">
      <div role="img" aria-label="Photo taken: closed sign on the door" style="width:76px;height:66px;border-radius:12px;overflow:hidden;flex:none"><svg viewBox="0 0 76 66" width="76" height="66" aria-hidden="true"><rect width="76" height="66" fill="#B6C3D0"/><rect x="18" y="6" width="40" height="60" fill="#8FA3B8"/><rect x="24" y="20" width="28" height="14" rx="2" fill="#FFFFFF"/><rect x="28" y="25" width="20" height="4" rx="1" fill="#C9343D"/></svg></div>
      <button type="button" class="scanbox" style="min-height:66px;border-color:var(--line2)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg><span><b>Retake photo</b><small>1 photo added</small></span></button>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800">Note <span class="small" style="font-weight:600;margin-top:-4px">Optional</span>
      <input class="field" style="height:50px" type="text" value="Closed sign up. Rang the number, no answer."></label>
    <div style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2)">
      <span style="flex:none;color:var(--green)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></span>
      <span>The <b style="color:var(--ink)">3 cartons stay on the truck</b> and come back to the depot. The office sees it straight away.</span>
    </div>
  </div>
  <button type="button" class="big primary" style="flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12v10H2Z"/><path d="M14 9h4.5L22 12.5V16h-8Z"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg>Back on the truck</button>
</main>
</body>
</html>
